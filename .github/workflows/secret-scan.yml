name: Secret Scanning & Privacy Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan-secrets-and-privacy:
    name: Secret & Privacy Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit for Forbidden Secret Files
        run: |
          echo "Scanning working tree and git history for forbidden secret files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E "(^|/)keys\.toml$|(^|/)secrets\.toml$|(^|/)secrets/|(^|/)\.env$" || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::CRITICAL SECURITY FAILURE: Forbidden secret file(s) found in git index:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "✓ No secret files found in repository tree."

      - name: Audit for Personal Paths & Usernames
        run: |
          echo "Scanning codebase for hardcoded private user paths..."
          FAIL=0
          # Check for local windows user paths
          if git grep -EI "C:\\\\Users\\\\[a-zA-Z0-9_-]+" -- ':!assets' ':!.github/workflows/secret-scan.yml' || git grep -EI "C:/Users/[a-zA-Z0-9_-]+" -- ':!assets' ':!.github/workflows/secret-scan.yml'; then
            echo "::error::Hardcoded Windows user profile path detected in repository!"
            FAIL=1
          fi
          # Check for local project drive paths
          PRJ_KW="Antigravity""Projects"
          if git grep -EI "[a-zA-Z]:\\\\$PRJ_KW" -- ':!assets' ':!.github/workflows/secret-scan.yml' || git grep -EI "[a-zA-Z]:/$PRJ_KW" -- ':!assets' ':!.github/workflows/secret-scan.yml'; then
            echo "::error::Hardcoded absolute project path detected in repository!"
            FAIL=1
          fi
          if [ $FAIL -ne 0 ]; then
            echo "::error::PII audit failed. Replace private paths with relative paths or <WORKSPACE_ROOT>."
            exit 1
          fi
          echo "✓ Zero personal or private paths detected."

      - name: Scan for High-Entropy Credentials and API Keys
        run: |
          echo "Checking codebase for accidental inline secrets (API keys, bot tokens)..."
          FAIL=0
          if git grep -EI "[0-9]{8,10}:[a-zA-Z0-9_-]{35}" -- ':!assets'; then
            echo "::error::Potential Telegram bot token detected!"
            FAIL=1
          fi
          if git grep -EI "ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}" -- ':!assets'; then
            echo "::error::Potential GitHub token detected!"
            FAIL=1
          fi
          if [ $FAIL -ne 0 ]; then
            exit 1
          fi
          echo "✓ No high-entropy API keys or credentials detected."
