  <title>cherry_tomato_deep_root_riser — Interactive 3D CAD Viewer (Bambu Lab P2S)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    button {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    button:hover { background: #30363d; color: #fff; }
    .badge { display: inline-block; background: #238636; color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 12px; margin-bottom: 6px; }

    document.getElementById('btnTop').onclick = () => {
      camera.position.set(0, -1, 420); controls.target.set(0, 0, 95); controls.update();
    };
    document.getElementById('btnBottom').onclick = () => {
      camera.position.set(0, 1, -340); controls.target.set(0, 0, 0); controls.update();
    };
    document.getElementById('btnWire').onclick = () => { mat.wireframe = !mat.wireframe; };
    document.getElementById('btnBed').onclick = () => { bedGroup.visible = !bedGroup.visible; };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
