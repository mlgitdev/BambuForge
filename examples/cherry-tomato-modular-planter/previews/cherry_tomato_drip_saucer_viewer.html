    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    const loader = new STLLoader();
    const geometry = loader.parse(bytes.buffer);
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const sx = (bb.max.x - bb.min.x).toFixed(1);
    const sy = (bb.max.y - bb.min.y).toFixed(1);
    const sz = (bb.max.z - bb.min.z).toFixed(1);
    document.getElementById('dims').textContent = `Outer Bounding Box: ${sx} × ${sy} × ${sz} mm`;

    const mat = new THREE.MeshStandardMaterial({
      color: 0x46956c, roughness: 0.38, metalness: 0.12, side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geometry, mat);
    scene.add(mesh);

    const edgeGeo = new THREE.EdgesGeometry(geometry, 22);
    const edgeLines = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0x111820, transparent: true, opacity: 0.45 }));
    scene.add(edgeLines);

    document.getElementById('btnIso').onclick = () => {
      camera.position.set(340, -340, 290); controls.target.set(0, 0, 95); controls.update();
    };
    document.getElementById('btnTop').onclick = () => {
      camera.position.set(0, -1, 420); controls.target.set(0, 0, 95); controls.update();
    };
    document.getElementById('btnBottom').onclick = () => {
      camera.position.set(0, 1, -340); controls.target.set(0, 0, 0); controls.update();
    };
    document.getElementById('btnWire').onclick = () => { mat.wireframe = !mat.wireframe; };
    document.getElementById('btnBed').onclick = () => { bedGroup.visible = !bedGroup.visible; };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
